services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
  
  database:
    image: mysql:8
    container_name: mysql-database
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rnd@2026
      MYSQL_DATABASE: ai-heart-predict
      MYSQL_USER: app_user
      MYSQL_PASSWORD: rnd@2026
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: